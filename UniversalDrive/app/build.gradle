plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.universaldrive.obd'
    compileSdk 35

    defaultConfig {
        applicationId 'com.universaldrive.obd'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    // Keep Java and Kotlin bytecode targets aligned for the GitHub Actions JDK 17 build.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
